name: Build and Push Development Docker Images

on:
  push:
    branches: [ "main" ]
    paths:
      - .github/workflows/docker-build-auto-current.yml
      - Dockerfile
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:

# Both publishers and their cleanup jobs operate on the same GHCR package.
concurrency:
  group: docker

jobs:
  build-and-push:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name
      run: |
        echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Build and push Docker image (single arch)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: true
        provenance: true
        platforms: linux/${{ matrix.arch }}
        build-args: |
          CMAKE_CUDA_ARCHITECTURES=121
        tags: ghcr.io/${{ env.REPO_LC }}:current-${{ matrix.arch }}

  manifest:
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name
      run: |
        echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Create and push multi-arch manifest tag
      shell: bash
      run: |
        IMAGE="ghcr.io/${REPO_LC}"

        docker buildx imagetools create \
          -t "${IMAGE}:current" \
          "${IMAGE}:current-amd64" \
          "${IMAGE}:current-arm64"

        docker buildx imagetools inspect "${IMAGE}:current"

        # Fetch every child; inspecting the index alone misses deleted manifests.
        MANIFESTS=$(docker buildx imagetools inspect "${IMAGE}:current" --raw)
        DIGESTS=$(jq -er '.manifests[].digest' <<< "$MANIFESTS")
        while IFS= read -r DIGEST; do
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" > /dev/null
        done <<< "$DIGESTS"

  cleanup:
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
    - name: Set lowercase package name
      shell: bash
      run: |
        PACKAGE_NAME=${GITHUB_REPOSITORY##*/}
        echo "PACKAGE_NAME_LC=${PACKAGE_NAME,,}" >> "$GITHUB_ENV"
        echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean up untagged Docker images
      uses: UnitVectorY-Labs/delete-package-versions@26201fcc84c14aa3964764b989352ed24e4270ab # reference-aware cleanup, Node 24
      with:
        owner: ${{ github.repository_owner }}
        package-name: ${{ env.PACKAGE_NAME_LC }}
        package-type: container
        min-versions-to-keep: 5
        delete-only-untagged-versions: 'true'

    - name: Verify both published images and attestations after cleanup
      shell: bash
      run: |
        IMAGE="ghcr.io/${REPO_LC}"
        for TAG in current master; do
          MANIFEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw)
          DIGESTS=$(jq -er '.manifests[].digest' <<< "$MANIFEST")
          while IFS= read -r DIGEST; do
            docker buildx imagetools inspect "${IMAGE}@${DIGEST}" > /dev/null
          done <<< "$DIGESTS"
        done
