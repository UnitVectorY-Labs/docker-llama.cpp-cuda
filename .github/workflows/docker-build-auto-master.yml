name: Build and Push Master Docker Images

on:
  push:
    branches: [ "main" ]
    paths:
      - .github/workflows/docker-build-auto-master.yml
      - Dockerfile
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:

# Both publishers and their cleanup jobs operate on the same GHCR package.
concurrency:
  group: docker

jobs:
  build-and-push:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name
      run: |
        echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Build and push Docker image (single arch)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: true
        provenance: true
        platforms: linux/${{ matrix.arch }}
        build-args: |
          CMAKE_CUDA_ARCHITECTURES=121
          LLAMA_CPP_REF=master
        tags: ghcr.io/${{ env.REPO_LC }}:master-${{ matrix.arch }}

  manifest:
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name
      run: |
        echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Create and push multi-arch manifest tag
      shell: bash
      run: |
        IMAGE="ghcr.io/${REPO_LC}"

        docker buildx imagetools create \
          -t "${IMAGE}:master" \
          "${IMAGE}:master-amd64" \
          "${IMAGE}:master-arm64"

        docker buildx imagetools inspect "${IMAGE}:master"

        # Fetch every child; inspecting the index alone misses deleted manifests.
        MANIFESTS=$(docker buildx imagetools inspect "${IMAGE}:master" --raw)
        DIGESTS=$(jq -er '.manifests[].digest' <<< "$MANIFESTS")
        while IFS= read -r DIGEST; do
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" > /dev/null
        done <<< "$DIGESTS"

  cleanup:
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
    - name: Set lowercase package name
      shell: bash
      run: |
        PACKAGE_NAME=${GITHUB_REPOSITORY##*/}
        echo "PACKAGE_NAME_LC=${PACKAGE_NAME,,}" >> "$GITHUB_ENV"
        echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Protect all manifests referenced by tagged images
      id: protected
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # The official deletion action cannot follow references. Supply its
        # ignore-versions input with every live image and attestation digest.
        DIGESTS=$(gh api --paginate \
          "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME_LC}/versions?per_page=100" \
          --jq '.[] | select(.metadata.container.tags | length > 0) | .name')
        test -n "$DIGESTS"
        mapfile -t PENDING <<< "$DIGESTS"
        # Also read the known live tags directly; package metadata may lag pushes.
        for TAG in current current-amd64 current-arm64 master master-amd64 master-arm64; do
          ROOT=$(docker buildx imagetools inspect "ghcr.io/${REPO_LC}:${TAG}" \
            --format '{{json .Manifest}}' | jq -er '.digest')
          PENDING+=("$ROOT")
        done
        declare -A SEEN
        while (( ${#PENDING[@]} )); do
          DIGEST="${PENDING[-1]}"
          unset 'PENDING[-1]'
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ -n "${SEEN[$DIGEST]:-}" ]]; then
            continue
          fi
          MANIFEST=$(docker buildx imagetools inspect "ghcr.io/${REPO_LC}@${DIGEST}" --raw)
          jq -e '.schemaVersion == 2 and (has("manifests") or (has("config") and has("layers")))' \
            <<< "$MANIFEST" > /dev/null
          SEEN[$DIGEST]=1
          CHILDREN=$(jq -r '[.manifests[]?.digest, .subject.digest? // empty][]' <<< "$MANIFEST")
          if [[ -n "$CHILDREN" ]]; then
            mapfile -t CHILD_DIGESTS <<< "$CHILDREN"
            PENDING+=("${CHILD_DIGESTS[@]}")
          fi
        done
        PATTERN=$(printf '%s\n' "${!SEEN[@]}" | sort | paste -sd '|')
        echo "ignore-versions=^(${PATTERN})$" >> "$GITHUB_OUTPUT"
        echo "digests=${!SEEN[*]}" >> "$GITHUB_OUTPUT"
        echo "Protecting ${#SEEN[@]} tagged or referenced manifests from deletion."

    - name: Clean up untagged Docker images
      uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
      with:
        owner: ${{ github.repository_owner }}
        package-name: ${{ env.PACKAGE_NAME_LC }}
        package-type: container
        min-versions-to-keep: 5
        delete-only-untagged-versions: 'true'
        ignore-versions: ${{ steps.protected.outputs.ignore-versions }}

    - name: Verify protected manifests after cleanup
      shell: bash
      env:
        PROTECTED_DIGESTS: ${{ steps.protected.outputs.digests }}
      run: |
        read -ra DIGESTS <<< "$PROTECTED_DIGESTS"
        for DIGEST in "${DIGESTS[@]}"; do
          docker buildx imagetools inspect "ghcr.io/${REPO_LC}@${DIGEST}" > /dev/null
        done
